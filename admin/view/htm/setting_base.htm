<script>
var jform = $('#form');
var jsubmit = $('#submit');
jform.on('submit', function() {
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			jsubmit.text(message).delay(1000).button('reset');
		} else if(xn.is_number(code)) {
			alert(message);
			jsubmit.button('reset');
		} else {
			jform.find('[name="'+code+'"]').alert(message).focus();
			jsubmit.button('reset');
		}
	});
	return false;
});

$('#nav li.nav-item-setting').addClass('active');

// Logo 上传：转 base64 预览 + 存隐藏字段
$('#logo_input').on('change', function(e) {
	var file = this.files[0];
	if(!file) return;
	var reader = new FileReader();
	reader.onload = function(ev) {
		$('#logo_preview').attr('src', ev.target.result);
		$('#logo').val(ev.target.result);
	};
	reader.readAsDataURL(file);
});

</script>
