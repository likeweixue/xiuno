<script>
var jform = $('#form');
var jsubmit = $('#submit');

// 侧边栏开关表单
var jpanel_form = $('#panel_form');
jpanel_form.on('submit', function() {
	var jbtn = jpanel_form.find('button[type="submit"]');
	jbtn.button('loading');
	var postdata = jpanel_form.serialize();
	$.xpost(jpanel_form.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			jbtn.button('reset');
		} else {
			alert(message);
			jbtn.button('reset');
		}
	});
	return false;
});

$('.row_add').on('click', function() {
	var s = '<tr align="center" rowid="0">'
		+ '<td></td>'
		+ '<td><input type="text" class="form-control" name="name[0]" value="" placeholder="<?php echo lang('link_name');?>"></td>'
		+ '<td><input type="text" class="form-control" name="url[0]" value="" placeholder="http://"></td>'
		+ '<td><input type="text" class="form-control" name="rank[0]" value="0" placeholder="<?php echo lang('link_rank');?>"></td>'
		+ '<td><a class="btn row_delete" role="button" tabindex="0"><?php echo lang('delete');?></a></td>'
		+ '</tr>';
	$('tbody').append(s);
});

jform.on('click', '.row_delete', function() {
	var jtr = $(this).parents('tr');
	var rowid = jtr.attr('rowid');
	if(rowid > 0) {
		var name = 'delete[' + rowid + ']';
		if(jform.find('input[name="' + name + '"]').length == 0) {
			jform.append('<input type="hidden" name="' + name + '" value="1">');
		}
	}
	jtr.remove();
});

jform.on('submit', function() {
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			window.location.reload();
		} else {
			alert(message);
			jsubmit.button('reset');
		}
	});
	return false;
});
</script>
