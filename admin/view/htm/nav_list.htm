<script>

var maxid = <?php echo $maxid;?>;

var jform = $("#form");
var jsubmit = $("#submit");
jform.on('submit', function(){
	jform.reset();
	jsubmit.button('loading');
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			jsubmit.text(message).delay(3000).location();
			return;
		} else {
			alert(message);
			jsubmit.button('reset');
		}
	});
	return false;
});

var jarrlist = $('.arrlist');

// 删除
jarrlist.on('click', 'a.row_delete', function() {
	var jthis = $(this);
	var jtr = jthis.parents('tr');
	jtr.remove();
	return false;
});

// 增加
$('a.row_add').on('click', function() {
	var jclone = jarrlist.find('tr').last().clone();
	jclone.insertAfter(jarrlist.find('tr').last());
	var rowid = ++maxid;
	jclone.attr('rowid', rowid);
	jclone.find('td').first().text(rowid);
	// 清空值
	jclone.find('input').val('');
	// 修改 [] 中的值为 rowid
	jclone.find('input').attr_name_index(rowid);
	return false;
});

</script>
