<script>
var jform = $('#form');
var jsubmit = $('#submit');
var jfid = jform.find('select[name="fid"]');
var jdoctype = $('#doctype');
var jdoctype_select = $('#doctype_select');
var current_mode = '<?php echo $form_doctype;?>';
var jmessage = $('#message');
var jrich = $('#cb_rich');
var jpreview = $('#cb_preview');
var jsplit = $('#cb_split');
var jfullscreen = $('#cb_fullscreen');
var jeditor_body = $('#cb_editor_body');
var split_on = false;

// 各模式对应的语法标记
var syntax_map = {
	'2': { h1: ['# ', ''], h2: ['## ', ''], h3: ['### ', ''], bold: ['**', '**'], italic: ['*', '*'], underline: ['<u>', '</u>'], strike: ['~~', '~~'], quote: ['> ', ''], code: ['`', '`'], hr: ['\n---\n', ''], link: ['[', '](url)'], image: ['![', '](url)'] },
	'3': { h1: ['[size=5]', '[/size]'], h2: ['[size=4]', '[/size]'], h3: ['[size=3]', '[/size]'], bold: ['[b]', '[/b]'], italic: ['[i]', '[/i]'], underline: ['[u]', '[/u]'], strike: ['[s]', '[/s]'], quote: ['[quote]', '[/quote]'], code: ['[code]', '[/code]'], hr: ['\n[hr]\n', ''], link: ['[url]', '[/url]'], image: ['[img]', '[/img]'] },
	'4': { h1: ['yi ', ''], h2: ['er ', ''], h3: ['san ', ''], bold: ['jc ', ''], italic: ['xt ', ''], underline: ['xhx ', ''], strike: ['scx ', ''], quote: ['yy ', ''], code: ['hndm ', ''], hr: ['\nfgx\n', ''], link: ['lj ', ' 网址'], image: ['tplj ', ' 图片地址'] }
};
var html_map = {
	h1: ['<h1>', '</h1>'], h2: ['<h2>', '</h2>'], h3: ['<h3>', '</h3>'],
	bold: ['<strong>', '</strong>'], italic: ['<em>', '</em>'], underline: ['<u>', '</u>'], strike: ['<del>', '</del>'],
	quote: ['<blockquote>', '</blockquote>'], code: ['<code>', '</code>'], hr: ['<hr>', ''], link: ['<a href="url">', '</a>'], image: ['<img src="', '">']
};

// 前端 markdown/bbcode 预览解析（轻量）
function markdown_parse(s) {
	s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	var lines = s.split('\n');
	var out = [], in_code = false;
	for(var i = 0; i < lines.length; i++) {
		var line = lines[i];
		if(/^```/.test(line)) { in_code = !in_code; out.push(in_code ? '<pre><code>' : '</code></pre>'); continue; }
		if(in_code) { out.push(line); continue; }
		var m;
		if(m = line.match(/^(#{1,6})\s+(.*)$/)) { out.push('<h' + m[1].length + '>' + m[2] + '</h' + m[1].length + '>'); continue; }
		if(m = line.match(/^[-*+]\s+(.*)$/)) { out.push('<li>' + m[1] + '</li>'); continue; }
		if(m = line.match(/^>\s?(.*)$/)) { out.push('<blockquote>' + m[1] + '</blockquote>'); continue; }
		if(/^(-{3,}|\*{3,})$/.test(line.trim())) { out.push('<hr>'); continue; }
		out.push('<p>' + md_inline(line) + '</p>');
	}
	return out.join('\n');
}
function md_inline(s) {
	s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
	s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
	s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
	s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
	s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
	return s;
}
function bbcode_parse(s) {
	s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
	s = s.replace(/\n/g, '<br>');
	s = s.replace(/\[b\](.*?)\[\/b\]/gi, '<strong>$1</strong>');
	s = s.replace(/\[i\](.*?)\[\/i\]/gi, '<em>$1</em>');
	s = s.replace(/\[u\](.*?)\[\/u\]/gi, '<u>$1</u>');
	s = s.replace(/\[s\](.*?)\[\/s\]/gi, '<del>$1</del>');
	s = s.replace(/\[quote\](.*?)\[\/quote\]/gi, '<blockquote>$1</blockquote>');
	s = s.replace(/\[url\](.*?)\[\/url\]/gi, '<a href="$1">$1</a>');
	return s;
}

// 初始化格式按钮组
jdoctype_select.find('.cb-ed-mode').each(function() {
	if($(this).data('mode') == current_mode) $(this).addClass('on');
});
jdoctype.val(current_mode);

// 富文本编辑器的初始内容
jrich.html(jmessage.val());

// 应用当前模式
function apply_mode() {
	var is_rich = (current_mode == '0');
	// 富文本模式：显示 contenteditable，隐藏 textarea
	if(is_rich) {
		jmessage.hide();
		jrich.show();
	} else {
		jmessage.show();
		jrich.hide();
	}
	// 非富文本/纯文本时才显示快捷语法按钮（富文本用 contenteditable 的 execCommand）
	$('.cb-editor-tools .cb-ed-btn').each(function() {
		var tag = $(this).data('tag');
		// 富文本模式下快捷语法按钮也可用（execCommand），纯文本模式隐藏
		if(current_mode == '1') {
			$(this).hide();
		} else {
			$(this).show();
		}
	});
	// 分栏按钮：纯文本/富文本不需要
	if(current_mode == '1' || current_mode == '0') {
		jsplit.hide();
		if(split_on) toggle_split(false);
	} else {
		jsplit.show();
	}
	// 富文本模式下，快捷语法按钮改为 execCommand
}

// 切换格式
jdoctype_select.on('click', '.cb-ed-mode', function() {
	jdoctype_select.find('.cb-ed-mode').removeClass('on');
	$(this).addClass('on');
	// 切换前，把富文本内容同步回 textarea
	if(current_mode == '0') {
		jmessage.val(jrich.html());
	}
	current_mode = $(this).data('mode');
	jdoctype.val(current_mode);
	// 富文本模式：把 textarea 内容同步到 contenteditable
	if(current_mode == '0') {
		jrich.html(jmessage.val());
	}
	apply_mode();
	update_preview();
});

// 富文本 contenteditable 实时同步到 textarea
jrich.on('input', function() {
	jmessage.val(jrich.html());
	update_preview();
});

// 快捷语法按钮：点击在光标处插入对应语法
$('.cb-editor-tools').on('click', '.cb-ed-btn', function() {
	var tag = $(this).data('tag');
	
	// 富文本模式：用 execCommand
	if(current_mode == '0') {
		var cmd_map = {
			h1: ['formatBlock', '<h1>'], h2: ['formatBlock', '<h2>'], h3: ['formatBlock', '<h3>'],
			bold: ['bold'], italic: ['italic'], underline: ['underline'], strike: ['strikeThrough'],
			quote: ['formatBlock', '<blockquote>'], hr: ['insertHorizontalRule']
		};
		var c = cmd_map[tag];
		if(c) {
			jrich.focus();
			document.execCommand(c[0], false, c[1] || null);
			jmessage.val(jrich.html());
		} else if(tag == 'code') {
			jrich.focus();
			document.execCommand('formatBlock', false, '<pre>');
			jmessage.val(jrich.html());
		} else if(tag == 'link') {
			var url = prompt('URL:', 'http://');
			if(url) { jrich.focus(); document.execCommand('createLink', false, url); jmessage.val(jrich.html()); }
		} else if(tag == 'image') {
			var url = prompt(lang.image + ' URL:', 'http://');
			if(url) { jrich.focus(); document.execCommand('insertImage', false, url); jmessage.val(jrich.html()); }
		}
		update_preview();
		return;
	}
	
	var el = jmessage[0];
	var start = el.selectionStart || 0;
	var end = el.selectionEnd || 0;
	var text = jmessage.val();
	var selected = text.substring(start, end);
	
	// 根据当前模式取语法
	var wrap;
	if(current_mode == '2' || current_mode == '3' || current_mode == '4') {
		wrap = syntax_map[current_mode][tag];
	} else {
		wrap = html_map[tag];
	}
	if(!wrap) return;
	
	var line_tags = ['h1', 'h2', 'h3', 'quote', 'hr'];
	var replacement;
	if(line_tags.indexOf(tag) >= 0) {
		replacement = wrap[0] + (selected || text.substring(start)) + wrap[1];
	} else {
		replacement = wrap[0] + (selected || '') + wrap[1];
	}
	
	jmessage.val(text.substring(0, start) + replacement + text.substring(end));
	jmessage.focus();
	update_preview();
});

// 更新预览
function update_preview() {
	if(!split_on) return;
	var src = jmessage.val();
	var html = '';
	if(current_mode == '2') {
		html = markdown_parse(src);
	} else if(current_mode == '3') {
		html = bbcode_parse(src);
	} else if(current_mode == '4' && typeof YiText != 'undefined') {
		html = YiText.parse(src);
	} else {
		html = escape_html(src).replace(/\n/g, '<br>');
	}
	jpreview.html(html);
}

function escape_html(s) {
	return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 分栏切换
function toggle_split(on) {
	split_on = on;
	if(on) {
		jpreview.show();
		jsplit.addClass('on');
		update_preview();
	} else {
		jpreview.hide();
		jsplit.removeClass('on');
	}
}
jsplit.on('click', function() {
	toggle_split(!split_on);
});

// 全屏切换
jfullscreen.on('click', function() {
	var wrap = jform.closest('.card');
	if(!wrap.hasClass('cb-editor-fullscreen')) {
		wrap.addClass('cb-editor-fullscreen');
		jfullscreen.addClass('on');
	} else {
		wrap.removeClass('cb-editor-fullscreen');
		jfullscreen.removeClass('on');
	}
});

// 键盘输入时更新预览
jmessage.on('input', function() {
	update_preview();
});

apply_mode();

jform.on('submit', function() {
	jform.reset();
	jsubmit.button('loading');
	
	// 富文本模式：把 contenteditable 内容同步到 textarea
	if(current_mode == '0') {
		jmessage.val(jrich.html());
	}
	// 同步 doctype
	jdoctype.val(current_mode);
	
	// 易文本模式：前端用 YiText 渲染为 HTML 后，以 doctype=0 提交
	if(current_mode == '4' && typeof YiText != 'undefined') {
		jmessage.val(YiText.parse(jmessage.val(), {css: true}));
		jdoctype.val('0');
	}
	
	var postdata = jform.serialize();
	$.xpost(jform.attr('action'), postdata, function(code, message) {
		if(code == 0) {
			$.alert(message);
			jsubmit.button(message).delay(1000).location('<?php echo $location;?>');
		} else if(xn.is_number(code)) {
			alert(message);
			jsubmit.button('reset');
		} else {
			$.alert(message);
			//jform.find('[name="'+code+'"]').alert(message).focus();
			jsubmit.button('reset');
		}
	});
	return false;
});

var jattachparent = $('.attachlist_parent');
$('#addattach').on('change', function(e) {
	var files = xn.get_files_from_event(e);
	if (!files) return;
	
	// 并发下会 服务端 session 写入会有问题，由客户端控制改为串行
	if (!jattachparent.find('.attachlist').length) {
		jattachparent.append('<fieldset class="fieldset"><legend><?php echo lang('uploaded_attach');?></legend><ul class="attachlist"><ul></fieldset>');
	}
	
	var jprogress = jattachparent.find('.progress');
	if(!jprogress.length) {
		jprogress = $('<div class="progress"><div class="progress-bar" role="progressbar" style="width: 25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100">25%</div></div>').appendTo(jattachparent);
	}
	jprogressbar = jprogress.find('.progress-bar');

	$.each_sync(files, function(i, callback) {
		var file = files[i];
		xn.upload_file(file, xn.url('attach-create'), {is_image: 0}, function(code, message) {
			if (code != 0) return $.alert(message);
			// 把文件 append 到附件列表
			var url = message.url;
			var filetype = message.filetype;
			var aid = message.aid;
			$('.attachlist').append('<li aid="' + aid + '"><a href="' + message.url + '" target="_blank"><i class="icon filetype ' + filetype + '"></i> ' + message.orgfilename + '</a> <a href="javascript:void(0);" class="delete ml-2"><i class="icon-remove"></i> <?php echo lang('delete');?></a></li>');
			callback();
			jprogress.hide();
		}, function(percent) {
			percent = xn.intval(percent);
			jprogressbar.css('width', percent+'%');
			jprogressbar.text(percent+'%');
			jprogress.show();
			console.log('progress:'+ percent); 
		});
	});
});

// 删除附件
jattachparent.on('click', 'a.delete', function() {
	var jlink = $(this);
	var jli = jlink.parents('li');
	var aid = jli.attr('aid');
	if(!window.confirm(lang.confirm_delete)) return false;
	$.xpost(xn.url('attach-delete-'+aid), function(code, message) {
		if(code != 0) return $.alert(message);
		jlink.parent().remove();
	});
	return false;
})

jform.find('[name="fid"]').checked(<?php echo $fid;?>);

$('li[data-active="fid-<?php echo $fid;?>"]').addClass('active');
